# Weekly drift check: runs the complete ssdtests suite on every platform with
# CI=false so only the skip_on_os() guards apply. Platform-specific snapshots
# are skipped where they are known not to reproduce; everything else is
# compared on all three platforms.
#
# test-fit-random-small.R is excluded: 20000 fits take hours and add no
# snapshot coverage.
name: full-tests
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/full-tests.yaml
permissions:
  contents: read
jobs:
  full-tests:
    runs-on: ${{ matrix.os }}
    name: full-tests (${{ matrix.os }})
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, local::.
          needs: check

      - name: Run full test suite with CI skips disabled
        env:
          CI: false
        run: |
          devtools::test(
            filter = "^(?!fit-random-small)",
            perl = TRUE,
            reporter = testthat::ProgressReporter$new(show_praise = FALSE),
            stop_on_failure = TRUE
          )
        shell: Rscript {0}

      - name: Upload new snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures-${{ matrix.os }}
          path: |
            tests/testthat/_snaps/**/*.new.*
            tests/testthat/_snaps/*.new.md
          if-no-files-found: ignore
